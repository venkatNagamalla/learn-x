
services:
  mongodb:
    image: mongo:7
    container_name: lms-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: lms_admin
      MONGO_INITDB_ROOT_PASSWORD: lms_dev_password
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: lms-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

volumes:
  mongodb_data:
  redis_data:
